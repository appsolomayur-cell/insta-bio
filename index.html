<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayur | Profile & Apps</title>
    <meta name="description" content="Discover my profile and apps including AppLens and ScanKaro.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <header class="profile-section">
            <div class="avatar-container">
                <!-- Replace with your actual image URL -->
                <img src="https://ui-avatars.com/api/?name=Mayur&background=random&size=150" alt="Mayur" class="avatar">
            </div>
            <h1 class="name">Mayur</h1>
            <p class="bio">Passionate Android Developer crafting intuitive and impactful mobile experiences.</p>
        </header>

        <section class="apps-section">
            <h2 class="section-title">My Apps</h2>
            <div class="apps-grid">
                
                <!-- App 1: AppLens -->
                <a href="https://play.google.com/store/apps/details?id=com.applens" class="app-card">
                    <div class="app-icon-wrapper">
                        <img src="applens-logo.png" alt="AppLens Logo" class="app-icon-img">
                    </div>
                    <div class="app-info">
                        <h3>AppLens</h3>
                        <p>App Inspector & APK</p>
                    </div>
                    <div class="app-action">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </a>

                <!-- App 2: ScanKaro -->
                <a href="https://play.google.com/store/apps/details?id=com.scankaro" class="app-card">
                    <div class="app-icon-wrapper">
                        <img src="scankaro-logo.png" alt="ScanKaro Logo" class="app-icon-img">
                    </div>
                    <div class="app-info">
                        <h3>ScanKaro</h3>
                        <p>Document PDF Scanner</p>
                    </div>
                    <div class="app-action">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </a>

            </div>
        </section>
    </main>
</body>
</html>
